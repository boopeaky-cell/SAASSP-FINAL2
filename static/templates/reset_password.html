{% extends "base.html" %}
{% block title %}Choose a new password - SAASSP{% endblock %}
{% block auth_content %}
<div class="auth-split">
  <div class="auth-visual">
    <img class="bg-photo" src="{{ url_for('static', filename='img/library_dome.jpg') }}" alt="">
    <div class="bg-scrim"></div>
    <div class="visual-content">
      <div class="brand-row"><div class="brand-mark">S</div><div class="brand-name">SAASSP</div></div>
      <div class="auth-headline">Choose a <em>new</em> password.</div>
    </div>
  </div>
  <div class="auth-form-side">
    <div class="auth-form-inner">
      <div class="auth-title">New password</div>
      <form method="post">
        <div class="mb-3"><label class="form-label">New password (at least 6 characters)</label>
          <input type="password" name="new_password" class="form-control" required minlength="6" autofocus></div>
        <div class="mb-3"><label class="form-label">Repeat new password</label>
          <input type="password" name="confirm_password" class="form-control" required></div>
        <button type="submit" class="btn btn-navy text-white w-100 py-2">Save new password</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
