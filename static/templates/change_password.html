{% extends "base.html" %}
{% block title %}Change password - SAASSP
<div class="section-title mt-4">E-mail for password resets</div>
<form method="post" class="card" style="max-width: 420px;">
  <input type="hidden" name="action" value="email">
  <div class="mb-3"><label class="form-label">E-mail address</label>
    <input type="email" name="email" value="{{ current_user.email or '' }}" class="form-control" required></div>
  <button type="submit" class="btn btn-navy text-white px-4">Save e-mail</button>
</form>
{% endblock %}
{% block content %}
<div class="section-title">Change password</div>
<form method="post" class="card" style="max-width: 420px;">
  <div class="mb-2"><label class="form-label">Current password</label>
    <input type="password" name="current_password" class="form-control" required></div>
  <div class="mb-2"><label class="form-label">New password (at least 6 characters)</label>
    <input type="password" name="new_password" class="form-control" required minlength="6"></div>
  <div class="mb-3"><label class="form-label">Repeat new password</label>
    <input type="password" name="confirm_password" class="form-control" required></div>
  <button type="submit" class="btn btn-navy text-white px-4">Save new password</button>
</form>

<div class="section-title mt-4">E-mail for password resets</div>
<form method="post" class="card" style="max-width: 420px;">
  <input type="hidden" name="action" value="email">
  <div class="mb-3"><label class="form-label">E-mail address</label>
    <input type="email" name="email" value="{{ current_user.email or '' }}" class="form-control" required></div>
  <button type="submit" class="btn btn-navy text-white px-4">Save e-mail</button>
</form>
{% endblock %}
