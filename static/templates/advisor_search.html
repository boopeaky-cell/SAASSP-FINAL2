{% extends "base.html" %}
{% block title %}Find a Student - SAASSP{% endblock %}
{% block content %}
<div class="section-title">Find a student</div>
<p class="text-muted">Type a student's number to see how they are progressing in every module. This view is read-only, and each lookup is recorded in the access log.</p>
<form method="get" class="d-flex gap-2" style="max-width: 480px;">
  <input type="text" name="student_number" value="{{ number }}" class="form-control" placeholder="Student number, e.g. 202285904" autofocus required>
  <button type="submit" class="btn btn-navy text-white px-4">Search</button>
</form>
{% endblock %}
