{% extends "base.html" %}
{% block title %}Forgot password - SAASSP{% endblock %}
{% block auth_content %}
<div class="auth-split">
  <div class="auth-visual">
    <img class="bg-photo" src="{{ url_for('static', filename='img/library_dome.jpg') }}" alt="">
    <div class="bg-scrim"></div>
    <div class="visual-content">
      <div class="brand-row"><div class="brand-mark">S</div><div class="brand-name">SAASSP</div></div>
      <div class="auth-headline">Forgot your password? <em>It happens.</em></div>
      <div class="auth-subtext">We'll send a reset link to the e-mail address on your account.</div>
    </div>
  </div>
  <div class="auth-form-side">
    <div class="auth-form-inner">
      <div class="auth-title">Reset your password</div>
      <div class="auth-sub">University of Zululand</div>
      <form method="post">
        <div class="mb-3">
          <label class="form-label">Student number / Email</label>
          <input type="text" name="identifier" class="form-control" required autofocus>
        </div>
        <button type="submit" class="btn btn-navy text-white w-100 py-2">Send reset link</button>
      </form>
      <div class="auth-switch"><a href="{{ url_for('auth.login') }}">Back to log in</a></div>
    </div>
  </div>
</div>
{% endblock %}
