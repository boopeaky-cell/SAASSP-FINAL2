[project]
name = "saassp"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "Flask==3.0.3",
    "Flask-SQLAlchemy==3.1.1",
    "Flask-Login==0.6.3",
    "PyMySQL==1.1.1",
    "psycopg2-binary==2.9.9",
    "python-dotenv==1.0.1",
    "google-genai",
    "groq",
    "anthropic",
]

[tool.vercel]
entrypoint = "backend.wsgi:app"
